name: Build flow metrics runtime
on:
  workflow_dispatch:
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - suffix: -web-backend
            context: .
            file: deploy/flow-metrics/backend.Dockerfile
          - suffix: -node-agent
            context: .
            file: deploy/flow-metrics/agent.Dockerfile
          - suffix: -web-frontend
            context: web/frontend
            file: web/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kibsoft/remnawave-admin${{ matrix.suffix }}:${{ github.sha }}
            ghcr.io/kibsoft/remnawave-admin${{ matrix.suffix }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/kibsoft/remnawave-admin
            org.opencontainers.image.revision=${{ github.sha }}
